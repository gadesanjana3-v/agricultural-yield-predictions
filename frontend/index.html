<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultural Yield Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌾 Agricultural Yield Prediction</h1>
        <p>Machine Learning Powered Crop Yield Forecasting</p>
    </header>

    <main class="main-layout">
        <section class="card container">
            <h2>Crop Yield Prediction</h2>
            <p class="subtitle">Enter agricultural parameters to predict expected yield.</p>

            <form id="predictionForm">
                <div class="form-group">
                    <label for="crop">Select Crop</label>
                    <select id="crop" required>
                        <option value="">Loading crops...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" value="2014" min="1990" max="2050" required>
                </div>

                <div class="form-group">
                    <label for="area">Crop Area Harvested (ha)</label>
                    <input type="number" id="area" placeholder="e.g. 21000" step="any" min="0.01" required>
                </div>

                <button type="submit" id="submitBtn">Predict Yield</button>
            </form>

            <div id="result" class="result-box hidden"></div>
        </section>
    </main>

    <footer>
        <p>Agricultural Yield Prediction and Productivity Factor Analysis</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
